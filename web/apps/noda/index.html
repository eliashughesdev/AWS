<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NODA</title>
    <!-- The chosen theme, set before the first paint (src/theme.ts keeps it). -->
    <script>
      try { if (localStorage.getItem('noda.theme') === 'light') document.documentElement.dataset.theme = 'light' } catch {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..800&display=swap"
      rel="stylesheet"
    />
    <!-- For the confirm and set-password screens, which are Loudibly's: their input font and icons.
         Two requests, because icon_names cuts every font in its request down to the letters of those names. -->
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&icon_names=error,key,link_off,mail,mark_email_read,visibility,visibility_off&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
