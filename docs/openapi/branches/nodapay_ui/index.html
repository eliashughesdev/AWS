<script id="spec" type="application/json">{"openapi": "3.1.0", "info": {"title": "NODA API v2.6.0 (Production)", "version": "2.6.0", "description": "The NODA API for merchant platforms and their wallet users.\n\nThis is the live environment. Coins and payments are real.\n\n**Two kinds of caller**\n\n- A **merchant platform** calls from its server, signing each request with its\n  API key (`merchantSignature` + `merchantProject`). It registers payers after\n  charging them (`/accounts/onboarding`) and reissues their claim links.\n- A **signed-in user** calls with a Cognito access token (`userToken`). Every\n  account, card and KYC route acts on that user only.\n\nThe card routes take either credential. A signed-in user acts on their own cards and\nneed not send `userId`; one naming another user is refused. A merchant names the\npayer in `userId`, and only its own payers are allowed.\n\nTwo routes, `/onboarding/verify` and `/onboarding/claim`, take no\ncredential: the one-time token from the payer's claim link is the credential.\n\n**Signing a merchant request**\n\n```\nX-Project:     <merchant id>\nAuthorization: Signature <timestamp>:<bodyHash>:<signature>\n```\n\n- `timestamp`: milliseconds since the Unix epoch. A request older than 10 seconds\n  is refused.\n- `bodyHash`: the hex MD5 of the request body exactly as sent.\n- `signature`: `base64(HMAC-SHA256(key, path + timestamp + bodyHash))`, where `key` is\n  the API key's secret (hex-decoded) and `path` is the request path including the\n  stage, e.g. `/v1/accounts/onboarding`.\n\n```js\nconst path = '/v1/accounts/onboarding'\nconst body = JSON.stringify(payload)\nconst timestamp = Date.now()\nconst bodyHash = crypto.createHash('md5').update(body).digest('hex')\nconst signature = crypto\n  .createHmac('sha256', Buffer.from(secret, 'hex'))\n  .update(`${path}${timestamp}${bodyHash}`)\n  .digest('base64')\n```\n\n**Errors**\n\nA request the API refuses answers `400` with an `Error` body; `error_code` is stable,\n`message` is for people and may change. `100053` (a user the caller may not act for)\nanswers `403` with an `Error` body instead. A missing or refused credential answers `403`\nfrom the gateway, before the request reaches the API, with a `GatewayError` body. Too\nmany requests answer `429`.\n\n**Amounts and times** are JSON numbers. Times named `createdAt`, `expiresAt` or\n`claimExpiresAt` are milliseconds since the epoch unless a field says it is an ISO\n8601 string.\n"}, "servers": [{"url": "https://api.noda.money", "description": "NODA API, Production"}], "tags": [{"name": "Merchant onboarding", "description": "Called by a merchant platform's server with its API key."}, {"name": "Claim link", "description": "The payer's first visit. No credential beyond the link's token."}, {"name": "Profile", "description": "The signed-in user's name and email."}, {"name": "Accounts", "description": "The signed-in user's custodial accounts, balances and history."}, {"name": "Money movement", "description": "Transfers act at once; deposits and withdrawals are queued and finish later."}, {"name": "KYC", "description": "Identity checks, run by Didit."}, {"name": "Cards", "description": "Cards saved for deposits."}], "security": [{"userToken": []}], "paths": {"/accounts/onboarding": {"post": {"tags": ["Merchant onboarding"], "operationId": "onboardPayer", "summary": "Register a payer after a card payment", "description": "Call after charging a payer's card on your platform. A payer you have not sent\nbefore gets a login, a custodial account on `chain` and a one-time claim link,\nemailed to them, for choosing a password. A payer you have sent before is only\nacknowledged. No money is moved.\n\n`transaction.id` makes the call idempotent: sending the same id again answers\n`200` with `replayed: true` and creates nothing.\n\n`externalId` is the payer's id on your platform; it only has to be unique among\nyour own payers.\n", "security": [{"merchantSignature": [], "merchantProject": []}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/OnboardingRequest"}, "example": {"externalId": "usr_9f3a2b", "firstName": "Juan", "lastName": "Perez", "email": "juan@example.com", "chain": "TRON", "transaction": {"id": "txn_abc123", "amount": 50.0, "currency": "EUR", "paidAt": "2026-09-09T10:22:31Z"}}}}}, "responses": {"201": {"description": "A new payer was registered.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/OnboardingResponse"}, "example": {"success": true, "res": {"data": {"userId": "0b9e4a7c-3f1d-4e0a-9d2b-6c8f1e2a3b4c", "isNew": true, "accountNo": "1000000123", "depositAddress": "TQ5n8aV7xY3m2kP9wR4sJ6tL1cE8bH7dG2", "claimToken": "q3J8k...base64url", "claimExpiresAt": 1789000000000, "emailSent": true}}}}}}, "200": {"description": "A known payer, or a replay of a `transaction.id` already received.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/OnboardingResponse"}}}}, "400": {"description": "- `100029` a required field is missing, `transaction`'s included (`transaction.id`)\n- `100031` a field is empty or of the wrong type, `email` is not an email address,\n  `transaction.amount` is not above 0 or `transaction.paidAt` is not a date-time\n- `100009` `chain` is not supported\n- `100040` the merchant does not exist or is not active\n- `100050` the merchant cannot hold `chain` yet\n- `100032` the email belongs to another user\n- `100033` the transaction was already processed\n- `100003` the records could not be saved; retry with the same `transaction.id`\n", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}, "403": {"$ref": "#/components/responses/Forbidden"}, "429": {"$ref": "#/components/responses/TooManyRequests"}}}}, "/accounts/onboarding/resend": {"post": {"tags": ["Merchant onboarding"], "operationId": "resendClaimLink", "summary": "Reissue a payer's claim link", "description": "Sends the payer a new claim link and makes the previous one unusable. Only for a\npayer who has not chosen a password yet.\n", "security": [{"merchantSignature": [], "merchantProject": []}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "required": ["externalId"], "properties": {"externalId": {"type": "string", "minLength": 1, "description": "The payer's id on your platform, as sent to `/accounts/onboarding`."}}}, "example": {"externalId": "usr_9f3a2b"}}}}, "responses": {"200": {"description": "A new link was issued.", "content": {"application/json": {"schema": {"type": "object", "required": ["success", "res"], "properties": {"success": {"type": "boolean", "const": true}, "res": {"type": "object", "properties": {"data": {"type": "object", "required": ["userId", "claimToken", "claimExpiresAt", "emailSent"], "properties": {"userId": {"type": "string"}, "claimToken": {"type": "string"}, "claimExpiresAt": {"type": "integer", "format": "int64"}, "emailSent": {"type": "boolean"}}}}}}}}}}, "400": {"description": "- `100029` `externalId` is missing\n- `100031` `externalId` is empty or not a string\n- `100038` no payer with this `externalId`\n- `100039` the payer has already chosen a password\n- `100003` the new link could not be saved\n", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}, "403": {"$ref": "#/components/responses/Forbidden"}, "429": {"$ref": "#/components/responses/TooManyRequests"}}}}, "/onboarding/verify": {"post": {"tags": ["Claim link"], "operationId": "verifyClaimLink", "summary": "Check a claim link", "description": "Says whether the link can still be used and who it is for. Does not use it up.", "security": [], "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "required": ["token"], "properties": {"token": {"type": "string", "minLength": 1, "description": "The token from the claim link."}}}}}}, "responses": {"200": {"description": "The link can be ntName": "Savings", "chain": "USDT_TRON", "provider": "PCF0001", "accountingCurrency": "USD"}}}}, "responses": {"200": {"description": "The account is open.", "content": {"application/json": {"schema": {"type": "object", "required": ["success", "res"], "properties": {"success": {"type": "boolean", "const": true}, "res": {"type": "object", "properties": {"data": {"type": "object", "required": ["id", "accountNo", "depositAddress"], "properties": {"id": {"type": "string", "description": "The user's id."}, "accountNo": {"type": "string"}, "depositAddress": {"type": "string"}}}}}}}}}}, "400": {"description": "- `100029` `chain`, `provider` or `accountingCurrency` is missing\n- `100031` a field is of the wrong type, `chain` or `accountingCurrency` is empty, `accountName` is longer than 40 characters, `email` is not an email address, or `provider` is unknown\n- `100009` `chain` is not supported\n- `100050` the user's merchant cannot hold `chain` yet\n- `100003` the account could not be saved\n- `100002` the account could not be created\n", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}, "403": {"$ref": "#/components/responses/Forbidden"}, "429": {"$ref": "#/components/responses/TooManyRequests"}}}}, "/accounts/rename": {"post": {"tags": ["Accounts"], "operationId": "renameAccount", "summary": "Name one of the signed-in user's accounts", "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "required": ["accountNumber", "name"], "properties": {"accountNumber": {"type": "string"}, "name": {"type": "string", "maxLength": 40, "description": "The new name. A blank one removes the name the account has."}}}, "example": {"accountNumber": "PCF00018604bbd641df4bb0aa5243e1e78f5cc4", "name": "Savings"}}}}, "responses": {"200": {"description": "Saved.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Success"}}}}, "400": {"description": "- `100029` `accountNumber` or `name` is missing\n- `100031` `accountNumber` is not an account number, or `name` is not a string or is longer than 40 characters\n- `100001` the user has no such account\n- `100003` the name could not be saved\n", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}, "403": {"$ref": "#/components/responses/Forbidden"}, "429": {"$ref": "#/components/responses/TooManyRequests"}}}}, "/accounts/transactions": {"post": {"tags": ["Accounts"], "operationId": "listTransactions", "summary": "One account's transactions, newest first", "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "required": ["accountNumber"], "properties": {"accountNumber": {"type": "string", "pattern": "^PCF[0-9]{4}[0-9a-f]{32}$", "description": "The account's number, as `/accounts/list` gives it."}}}}}}, "responses": {"200": {"description": "The transactions.", "content": {"application/json": {"schema": {"type": "object", "required": ["transactions"], "properties": {"transactions": {"type": "array", "items": {"$ref": "#/components/schemas/Transaction"}}}}}}}, "400": {"description": "- `100029` `accountNumber` is missing\n- `100031` `accountNumber` is not an account number\n- `100001` no such account\n", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}, "403": {"description": "The account belongs to someone else, or the credential was refused.", "content": {"application/json": {"schema": {"oneOf": [{"$ref": "#/components/schemas/Message"}, {"$ref": "#/components/schemas/GatewayError"}]}}}}, "429": {"$ref": "#/components/responses/TooManyRequests"}, "500": {"description": "The transactions could not be read.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Message"}}}}}}}, "/accounts/transfer": {"post": {"tags": ["Money movement"], "operationId": "transfer", "summary": "Move funds from one of the user's accounts to another account", "description": "Moves `amount` from the user's yptoAmount": 25, "destinationAddress": "TQ5n8aV7xY3m2kP9wR4sJ6tL1cE8bH7dG2"}}}}, "responses": {"200": {"description": "The withdrawal is queued.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/QueuedOperation"}}}}, "400": {"description": "- `100029` a required field is missing (`amount or cryptoAmount` when neither was\n  sent)\n- `100031` a field is malformed: the account number, an amount that is not a number\n  above 0, both amounts sent, or with `amount` a `currency` that is not a 3-letter code\n- `100001` no such account\n- `100005` the account belongs to someone else\n- `100006` the account cannot send coins\n- `100007` the available balance is too low\n- `100009` withdrawals of this coin are not available\n- `100048` `destinationAddress` is not an address on the account's network\n- `100002` the withdrawal could not be started and nothing was sent; the message says\n  whether the balance was restored\n", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}, "403": {"$ref": "#/components/responses/Forbidden"}, "429": {"$ref": "#/components/responses/TooManyRequests"}}}}, "/accounts/kyc/status": {"get": {"tags": ["KYC"], "operationId": "getKycStatus", "summary": "The signed-in user's identity check", "description": "Always the caller's own check; the route takes no parameters.", "responses": {"200": {"description": "The KYC state; `null` when no check was ever started.", "content": {"application/json": {"schema": {"type": "object", "required": ["kyc"], "properties": {"kyc": {"oneOf": [{"type": "null"}, {"$ref": "#/components/schemas/Kyc"}]}}}}}}, "400": {"description": "`100031` a query parameter was sent (the error names it); this route takes none.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}, "403": {"$ref": "#/components/responses/Forbidden"}, "404": {"description": "The user has no profile yet.", "content": {"application/json": {"schema": {"$ref": "#/compon
