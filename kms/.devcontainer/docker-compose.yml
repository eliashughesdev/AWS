version: "3.8"

services:
  api:
    image: node:20-slim
    working_dir: /workspace
    volumes:
      - ..:/workspace:cached
      - tatum-data:/root/.tatumrc
    ports:
      - "3000:3000"
    env_file:
      - ../.env
    command: sh -c "npm install && npm run dev"
    networks:
      - tatum-network
    depends_on:
      - tatum-kms

  tatum-kms:
    image: tatumio/tatum-kms:latest
    environment:
      - TATUM_API_KEY=${TATUM_API_KEY}
      - TATUM_KMS_PASSWORD=${TATUM_KMS_PASSWORD:-defaultPassword123}
    volumes:
      - tatum-data:/root/.tatumrc
    networks:
      - tatum-network
    stdin_open: true
    tty: true
    command: tail -f /dev/null

volumes:
  tatum-data:

networks:
  tatum-network:
    driver: bridge
